      canvas.width = Math.round(w*pr); canvas.height = Math.round(h*pr);
      msaa?.destroy(); msaa = device.createTexture({size:[canvas.width, canvas.height], format, sampleCount:4, usage:GPUTextureUsage.RENDER_ATTACHMENT});
    },
    render(time, align){
      camera.updateMatrixWorld(); vp.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
      U.set(vp.elements, 0); U.set([camera.position.x, camera.position.y, camera.position.z, time], 16);
      // Brighter than paper white: up to ~1.9x encoded when the rabbit locks in.
      U.set([D, SIZE, align, 1.05 + .85*align], 20); U.set([W1, W2, 0, 0], 24);
      device.queue.writeBuffer(ub, 0, U);
      const enc = device.createCommandEncoder();
      const pass = enc.beginRenderPass({colorAttachments:[{view:msaa.createView(), resolveTarget:gctx.getCurrentTexture().createView(),
        clearValue:{r:.0196, g:.0196, b:.0196, a:1}, loadOp:"clear", storeOp:"discard"}]});
      pass.setPipeline(pipeline); pass.setBindGroup(0, bind); pass.setVertexBuffer(0, quad); pass.setVertexBuffer(1, ib);
      pass.draw(4, N); pass.end(); device.queue.submit([enc.finish()]);
    }
  };
}

// ---------- Renderer B: WebGL (SDR screens, other browsers, and the HDR video export) ----------
function makeGL(){
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:RENDER});
  renderer.setClearColor(0x050505);
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
  const atlasTex = new THREE.CanvasTexture(atlas); atlasTex.anisotropy = 8;
  const base = new THREE.PlaneGeometry(1, 1), geo = new THREE.InstancedBufferGeometry();
  geo.index = base.index; geo.setAttribute("position", base.attributes.position); geo.setAttribute("uv", base.attributes.uv);
  const ibuf = new THREE.InstancedInterleavedBuffer(inst, 5);
  geo.setAttribute("aP", new THREE.InterleavedBufferAttribute(ibuf, 2, 0));
  geo.setAttribute("aT", new THREE.InterleavedBufferAttribute(ibuf, 1, 2));
  geo.setAttribute("aPh", new THREE.InterleavedBufferAttribute(ibuf, 1, 3));
  geo.setAttribute("aCell", new THREE.InterleavedBufferAttribute(ibuf, 1, 4));
  geo.instanceCount = N;
  const uniforms = {uAtlas:{value:atlasTex}, uTime:{value:0}, uD:{value:D}, uSize:{value:SIZE}, uAlign:{value:0}, uW:{value:new THREE.Vector2(W1, W2)}};
  const mat = new THREE.ShaderMaterial({uniforms, transparent:true, depthWrite:false, side:THREE.DoubleSide,
    vertexShader:`
    attribute vec2 aP; attribute float aT, aPh, aCell;
    uniform float uTime, uD, uSize, uAlign; uniform vec2 uW;
    varying vec2 vUv; varying float vLight;
    void main(){
      float t = aT*(1. + .2*sin(uTime*uW.x + aPh));
      float spin = (1. - uAlign)*2.6*sin(uTime*uW.y + aPh*1.7);
      vec3 l = vec3(position.x*cos(spin), position.y, position.x*sin(spin))*uSize*t;
      vec3 C0 = vec3(0., 0., uD);
      vec3 pos = C0 + t*(vec3(aP, 0.) - C0) + l;
      vec2 cell = vec2(mod(aCell, 16.), floor(aCell/16.));
      vUv = vec2((cell.x + uv.x)/16., 1. - (cell.y + 1. - uv.y)/8.);
      float dist = length(cameraPosition - pos);
      float near = .22 + .78*(1. - smoothstep(uD*.3, uD*1.9, dist));
      vLight = mix(near*mix(.55, 1., abs(cos(spin))), 1., uAlign);
      gl_Position = projectionMatrix*viewMatrix*vec4(pos, 1.);
    }`,
    fragmentShader:`
    uniform sampler2D uAtlas; varying vec2 vUv; varying float vLight;
    void main(){ float a = texture2D(uAtlas, vUv).a; if(a < .01) discard; gl_FragColor = vec4(vec3(.95, .945, .925)*vLight, a); }`
  });
  const mesh = new THREE.Mesh(geo, mat); mesh.frustumCulled = false;
  const scene = new THREE.Scene(); scene.add(mesh);

  // Export only: render to float, add edge refraction, encode as HLG (BT.2020) for an HDR video.
  let rt = null, post = null, postScene = null;
  const postCam = new THREE.Camera();
  if(RENDER){
    post = new THREE.ShaderMaterial({depthWrite:false, uniforms:{uTex:{value:null}, uRes:{value:new THREE.Vector2()}, uGain:{value:1}, uS:{value:new THREE.Vector3(0, 0, 0)}},
      vertexShader:`void main(){ gl_Position = vec4(position.xy*2., 0., 1.); }`,
      fragmentShader:`
      uniform sampler2D uTex; uniform vec2 uRes; uniform float uGain; uniform vec3 uS;
      float hlg(float e){ return e <= 1./12. ? sqrt(3.*e) : .17883277*log(12.*e - .28466892) + .55991073; }
      void main(){
        vec2 uv = gl_FragCoord.xy/uRes, d = (uv - .5)*2.;
        float r = length(d), f = pow(clamp((r - .5)/.6, 0., 2.), 2.);
        vec2 n = d/max(r, 1e-3);
        vec3 c = vec3(texture2D(uTex, uv - uS.x*f*n/uRes).r, texture2D(uTex, uv - uS.y*f*n/uRes).g, texture2D(uTex, uv - uS.z*f*n/uRes).b);
        vec3 L = pow(max(c, 0.), vec3(2.2))*uGain;
        L = vec3(dot(L, vec3(.6274, .3293, .0433)), dot(L, vec3(.0691, .9195, .0114)), dot(L, vec3(.0164, .0880, .8956)));
        vec3 E = clamp(L*.265, 0., 1.);
        gl_FragColor = vec4(hlg(E.r), hlg(E.g), hlg(E.b), 1.);
      }`});
    const q = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), post); q.frustumCulled = false;
    postScene = new THREE.Scene(); postScene.add(q);
  }
  return {
    hdr:false,
    resize(w, h){
      renderer.setPixelRatio(RENDER ? 1 : Math.min(devicePixelRatio || 1, 2)); renderer.setSize(w, h, false);
      if(RENDER){ const v = renderer.getDrawingBufferSize(new THREE.Vector2()); rt?.dispose();
        rt = new THREE.WebGLRenderTarget(v.x, v.y, {type:THREE.HalfFloatType, samples:4}); post.uniforms.uTex.value = rt.texture; post.uniforms.uRes.value.copy(v); }
    },
    render(time, align){
      uniforms.uTime.value = time; uniforms.uAlign.value = align;
      if(!RENDER){ renderer.render(scene, camera); return; }
      post.uniforms.uGain.value = 1 + 2.2*align;
      renderer.setRenderTarget(rt); renderer.render(scene, camera);
      renderer.setRenderTarget(null); renderer.render(postScene, postCam);
    }
  };
}

const R = RENDER ? makeGL() : (await makeGPU().catch(e => (console.warn(e), null))) || makeGL();
const W = () => RENDER ? +(new URLSearchParams(location.search).get("w") || 3840) : innerWidth;
const H = () => RENDER ? +(new URLSearchParams(location.search).get("h") || 2160) : innerHeight;
function resize(){ frameCamera(W(), H()); R.resize(W(), H()); }
addEventListener("resize", resize); resize();

// 4. Free tumble camera (any direction), zoom into the cloud, magnet back to the rabbit.
const Q = new THREE.Quaternion(), ID = new THREE.Quaternion(), tq = new THREE.Quaternion();
const AX = new THREE.Vector3(1, 0, 0), AY = new THREE.Vector3(0, 1, 0), FWD = new THREE.Vector3(0, 0, 1), dir = new THREE.Vector3();
let dist = D, vYaw = 0, vPitch = 0, tween = null, tweenEnd = performance.now() - 1200, interacted = false, lastInput = 0, autoStep = 0;
const ZMIN = 1.2, ZMAX = 44;
const turn = (yaw, pitch) => { Q.multiply(tq.setFromAxisAngle(AY, yaw)).multiply(tq.setFromAxisAngle(AX, pitch)).normalize(); };
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
function goTo(q, d, dur){ tween = {q0:Q.clone(), q1:q, d0:dist, d1:d, s:performance.now(), dur:reduce ? 1 : dur}; vYaw = vPitch = 0; }
const reveal = () => goTo(new THREE.Quaternion(), D, 3400);
function wander(){
  const q = new THREE.Quaternion(), s = () => Math.random() < .5 ? -1 : 1;
  const into = autoStep++ % 2 === 0;
  q.multiply(tq.setFromAxisAngle(AY, s()*(.8 + Math.random()*1.1))).multiply(tq.setFromAxisAngle(AX, s()*(.3 + Math.random()*.9)));
  goTo(q, into ? D*.42 : D*(.9 + Math.random()*.25), 5200);
}
const touch = () => { interacted = true; lastInput = performance.now(); tween = null; };
const zoomBy = f => { dist = Math.max(ZMIN, Math.min(ZMAX, dist*f)); };

const offAngle = () => Math.acos(Math.min(1, Math.max(-1, dir.copy(FWD).applyQuaternion(Q).z)));
function alignNow(){
  const zoomOff = Math.abs(Math.log(dist/D)), al = Math.max(0, 1 - offAngle()/.45)*Math.max(0, 1 - zoomOff/.6);
  return al*al*al;
}
function place(){ camera.position.set(0, 0, dist).applyQuaternion(Q); camera.quaternion.copy(Q); }

if(RENDER){
  // Scripted 12 s loop: rabbit, break apart, dive through the letters, rabbit again. Starts and ends on the same frame.
  const sm = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a)/(b - a))); return t*t*(3 - 2*t); };
  window.__gr = {ready:true, frames:LOOP*60, renderFrame(i){
    const t = i/60, w = sm(1.5, 4.2, t)*(1 - sm(8.6, 11.2, t)), s = Math.max(0, Math.min(1, (t - 1.5)/(11.2 - 1.5)));
    Q.identity(); turn(w*(1.05 + 1.15*Math.sin(Math.PI*s)), w*.42*Math.cos(2*Math.PI*s));
    dist = D*(1 - .6*w*Math.pow(Math.sin(Math.PI*s), 2));
    place(); R.render(t, alignNow());
  }};
} else {
  const pts = new Map(); let pinch = 0, lastTap = 0, downAt = null;
  canvas.addEventListener("pointerdown", e => {
    touch(); canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    downAt = {x:e.clientX, y:e.clientY, t:performance.now()};
    if(pts.size === 2){ const [a, b] = [...pts.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); }
  });
  canvas.addEventListener("pointermove", e => {
    const p = pts.get(e.pointerId); if(!p) return; touch();
    if(pts.size === 1){ vYaw = (e.clientX - p.x)*.006; vPitch = (e.clientY - p.y)*.006; turn(vYaw, vPitch); }
    p.x = e.clientX; p.y = e.clientY;
    if(pts.size === 2){ const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y); if(pinch) zoomBy(pinch/d); pinch = d; vYaw = vPitch = 0; }
  });
  const up = e => {
    pts.delete(e.pointerId); pinch = 0;
    if(e.pointerType === "touch" && downAt && pts.size === 0 && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) < 8 && performance.now() - downAt.t < 260){
      const now = performance.now(); if(now - lastTap < 320){ reveal(); lastTap = 0; } else lastTap = now;
    }
    downAt = null;
  };
  canvas.addEventListener("pointerup", up); canvas.addEventListener("pointercancel", up);
  canvas.addEventListener("dblclick", () => { touch(); reveal(); });
  canvas.addEventListener("wheel", e => { touch(); zoomBy(Math.exp(e.deltaY*(e.ctrlKey ? .01 : .0015))); e.preventDefault(); }, {passive:false});
  addEventListener("keydown", e => {
    const m = {ArrowLeft:[.05, 0], ArrowRight:[-.05, 0], ArrowUp:[0, .05], ArrowDown:[0, -.05]}[e.key];
    if(m){ touch(); vYaw = m[0]; vPitch = m[1]; e.preventDefault(); }
    if(e.key === "+" || e.key === "="){ touch(); zoomBy(.85); }
    if(e.key === "-"){ touch(); zoomBy(1/.85); }
    if(e.key === " " || e.key === "Enter"){ touch(); reveal(); e.preventDefault(); }
  });

  let clock = 0, last = performance.now();
  function frame(now){
    const dt = Math.min(.05, (now - last)/1000); last = now; clock += dt;
    if(tween){
      const p = Math.min(1, (now - tween.s)/tween.dur), e = ease(p);
      Q.slerpQuaternions(tween.q0, tween.q1, e); dist = tween.d0 + (tween.d1 - tween.d0)*e;
      if(p >= 1){ tween = null; tweenEnd = now; }
    } else if(pts.size === 0){
      turn(vYaw, vPitch); vYaw *= .93; vPitch *= .93;
      const ang = offAngle(), zoomOff = Math.abs(Math.log(dist/D));
      if(ang < .2 && zoomOff < .3 && Math.abs(vYaw) + Math.abs(vPitch) < .008){
        const f = 1 - Math.pow(.02, dt); Q.slerp(ID, f); dist += (D - dist)*f;
      }
      const idle = !interacted || now - lastInput > 9000;
      if(idle && now - tweenEnd > (ang < .01 ? 3400 : 1800)) ang < .01 ? wander() : reveal();
    }
    place(); R.render(clock, alignNow());
    requestAnimationFrame(frame);
  }
  window.__gr = {get clock(){ return clock; }, hdr:R.hdr, view(yaw, pitch, d){ touch(); Q.identity(); turn(yaw, pitch); dist = d ?? D; vYaw = vPitch = 0; }};
  requestAnimationFrame(frame);
}
</script>
